---
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: yamlfmt
        name: yamlfmt
        entry: yamlfmt
        language: system
        types: [yaml]

      - id: terraform-fmt
        name: terraform fmt
        entry: terraform
        args: [fmt, -check, -diff, -recursive]
        language: system
        pass_filenames: false
        files: \.(tf|tfvars)$

      # - id: tfsec
      #   name: tfsec
      #   entry: tfsec
      #   args: [--exclude-downloaded-modules]
      #   language: system
      #   pass_filenames: false
      #   files: \.(tf|tfvars)$

      - id: go-unit-tests
        name: go unit tests
        entry: go
        args: [test, -tags=unit, -timeout, 30s, -short, ., ./internal/..., ./pkg/...]
        language: system
        pass_filenames: false
        files: \.go$

    # - id: update-docs
    #   name: update provider docs
    #   entry: bash -c 'cd tools && go generate ./...'
    #   language: system
    #   pass_filenames: false

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports
      - id: golangci-lint
        args: [--new, ./internal/..., ./pkg/...]
